name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit + end-to-end tests
        run: pytest -q

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build demo repo
        run: python demo/build_demo_repo.py demo_repo
      - name: Honest branch must PASS (exit 0)
        run: tamperproof demo_repo --base main --head agent/honest
      - name: Cheating branch must BLOCK (exit 2)
        run: |
          set +e
          tamperproof demo_repo --base main --head agent/cheat --sarif cheat.sarif --md cheat.md
          code=$?
          set -e
          cat cheat.md >> "$GITHUB_STEP_SUMMARY"
          test "$code" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: tamperproof-report
          path: |
            cheat.sarif
            cheat.md
