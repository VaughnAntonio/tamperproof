name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit + end-to-end tests
        env:
          TAMPERPROOF_SKIP_GRADLE: "1"  # Kotlin e2e runs in the kotlin-demo job
        run: pytest -q

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build demo repo
        run: python demo/build_demo_repo.py demo_repo
      # The action itself (uses: ./) is the gate under test. Comments and SARIF stay off:
      # the findings point at files in demo_repo, not this repo.
      - name: Audit honest branch
        id: honest
        uses: ./
        with:
          repo: demo_repo
          base: main
          head: agent/honest
          comment: "false"
          upload-sarif: "false"
          fail-on: never
      - name: Audit cheating branch
        id: cheat
        uses: ./
        with:
          repo: demo_repo
          base: main
          head: agent/cheat
          comment: "false"
          upload-sarif: "false"
          fail-on: never
      - name: Honest must PASS (0), cheat must BLOCK (2)
        env:
          HONEST: ${{ steps.honest.outputs.exit-code }}
          CHEAT: ${{ steps.cheat.outputs.exit-code }}
        run: |
          echo "honest=$HONEST cheat=$CHEAT"
          test "$HONEST" -eq 0 && test "$CHEAT" -eq 2
      - name: Collect reports
        run: cp "${{ steps.cheat.outputs.markdown }}" cheat.md && cp "${{ steps.cheat.outputs.sarif }}" cheat.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: tamperproof-report
          path: |
            cheat.sarif
            cheat.md

  kotlin-demo:
    # Roadmap 7: the same proof engine on Kotlin/JUnit 5 via Gradle.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: pip install -e .
      - name: Kotlin end-to-end tests (must run, not skip)
        # pipefail: the default `bash -e` would let tee hide a pytest failure.
        run: |
          set -o pipefail
          pytest -q tests/test_kotlin.py -rs -k "kotlin_honest or kotlin_cheat" | tee pytest.log
          ! grep -q SKIPPED pytest.log
      - name: Build Kotlin demo repo
        run: python demo/build_kotlin_demo.py kotlin_demo_repo
      - name: Honest must PASS (0), cheat must BLOCK (2)
        run: |
          tamperproof kotlin_demo_repo --base main --head agent/honest
          set +e
          tamperproof kotlin_demo_repo --base main --head agent/cheat --md kotlin_cheat.md
          code=$?
          set -e
          cat kotlin_cheat.md >> "$GITHUB_STEP_SUMMARY"
          test "$code" -eq 2
