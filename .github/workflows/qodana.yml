# Qodana (code quality) next to tamperproof (test integrity). Both upload SARIF to code
# scanning under their own category; Qodana is advisory, tamperproof gates. See docs/QODANA.md.
name: qodana

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write    # Qodana PR summary comment
  checks: write           # Qodana annotations
  security-events: write  # SARIF upload

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # pr-mode diffs against this
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          upload-result: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
          category: qodana
