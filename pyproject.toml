[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamperproof"
version = "0.1.0"
description = "Prove, don't guess, when an AI coding agent games the test suite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vaughn Antonio" }]
dependencies = ["pytest>=7"]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
tamperproof = "tamperproof.cli:main"

[tool.setuptools]
packages = ["tamperproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
